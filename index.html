<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | REST Countries API</title>
  </head>

  <body>
    <header>
      <h1>Where in the world?</h1>

      <button type="button" class="theme-toggle">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M20.985 12.486A9 9 0 0 1 11.514 3.015 9 9 0 1 0 20.985 12.486Z"
          />
        </svg>
        <span class="theme-label">Dark Mode</span>
      </button>
    </header>

    <main>
      <section class="controls">
        <div class="search-box">
          <svg
            class="search-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 512 512"
            width="16"
            height="16"
            aria-hidden="true"
          >
            <path
              fill="currentColor"
              d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0s208 93.1 208 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
            />
          </svg>

          <input
            type="search"
            id="search"
            placeholder="Search for a country..."
            aria-label="Search for a country"
          />
        </div>

        <div class="filter-box">
          <select id="region-filter" aria-label="Filter by Region">
            <option value="" disabled selected hidden>Filter by Region</option>
            <option value="">All Regions</option>
            <option value="africa">Africa</option>
            <option value="americas">Americas</option>
            <option value="asia">Asia</option>
            <option value="europe">Europe</option>
            <option value="oceania">Oceania</option>
          </select>
        </div>
      </section>
      <section class="countries">
        <!-- Country cards will be rendered here -->
      </section>
      <section class="country-detail"></section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
